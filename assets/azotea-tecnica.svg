  <g font-family="ui-monospace, Consolas, monospace" font-size="14" letter-spacing="1.2">
    <path d="M69 114h156v31H69zM608 127h92v31h-92z" fill="#172725" stroke="#798C7F"/>
    <text x="80" y="134" fill="#FF6B3D">01</text>
    <text x="110" y="134" fill="#F8F3E8">PANELES</text>
    <text x="619" y="147" fill="#FF6B3D">02</text>
    <text x="649" y="147" fill="#F8F3E8">HVAC</text>
  </g>
