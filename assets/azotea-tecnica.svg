  <path d="M523 282l22-12v22l-22 12zm26-14l26-14v22l-26 14z" stroke="#ADC2AF" stroke-opacity=".77" stroke-width=".9"/>
  <path d="M529 285l10-5m16-9l13-7m-13 14l13-7" stroke="#ADC2AF" stroke-opacity=".77" stroke-width=".9"/>
  <ellipse cx="516" cy="245" rx="24" ry="11" fill="#23392F" stroke="#C4D8C7"/>
  <ellipse cx="516" cy="245" rx="18" ry="8" stroke="#9CB5A3"/>
  <ellipse cx="516" cy="245" rx="4" ry="2" fill="#C4D8C7"/>
  <path d="M498 246c9 2 10-2 18-1s11-3 13-5m-20-3c-1 2 1 5 7 8s5 5 3 7" stroke="#A7C0AE"/>

  <!-- Numbered editorial annotations. -->
  <g stroke="#FF6B3D" stroke-width="1.3">
    <path d="M232 130h31l63 109"/>
    <path d="M602 143h-26l-44 71"/>
    <circle cx="326" cy="239" r="3.5" fill="#172725"/>
    <circle cx="532" cy="214" r="3.5" fill="#172725"/>
