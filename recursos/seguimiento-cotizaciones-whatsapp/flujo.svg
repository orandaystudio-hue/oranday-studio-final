      <text y="94" font-size="27">Consulta</text>
    </g>
    <g transform="translate(455 391)">
      <circle r="43" fill="#F8F3E8" stroke="#145D56" stroke-width="3"/>
      <text y="9" font-size="24">02</text>
      <text y="94" font-size="27">Calificación</text>
    </g>
    <g transform="translate(745 391)">
      <circle r="43" fill="#F8F3E8" stroke="#145D56" stroke-width="3"/>
      <text y="9" font-size="24">03</text>
      <text y="94" font-size="27">Cotización</text>
    </g>
    <g transform="translate(1034 391)">
      <circle r="43" fill="#F8F3E8" stroke="#145D56" stroke-width="3"/>
      <text y="9" font-size="24">04</text>
      <text y="94" font-size="27">Seguimiento</text>
    </g>
